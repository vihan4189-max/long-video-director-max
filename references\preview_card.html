<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>Hyperframes Perplexity Render: FlashAttention-2 Memory Tiling</title>
  <!-- KaTeX for crisp LaTeX mathematical rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1920px;
      background-color: #111418;
      color: #F3F3EE;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }
    
    /* 9:16 Safe Zone Overlay Indicator (Optional Debug Grid) */
    .safe-zone {
      position: absolute;
      top: 240px;
      bottom: 470px;
      left: 80px;
      right: 80px;
      pointer-events: none;
      border: 1px dashed rgba(35, 39, 47, 0.5);
    }

    /* Perplexity Card Container */
    .pplx-card {
      position: absolute;
      left: 80px;
      top: 480px;
      width: 920px;
      background: #16191E;
      border: 1px solid #23272F;
      border-radius: 16px;
      padding: 36px 40px;
      box-shadow: 0 12px 40px -4px rgba(0, 0, 0, 0.6), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(14px);
      animation: pplxSpringEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 120ms;
    }

    @keyframes pplxSpringEnter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Perplexity Header Pill */
    .pplx-header-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(32, 184, 205, 0.12);
      border: 1px solid rgba(32, 184, 205, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      color: #20B8CD;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .pplx-title {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: #F3F3EE;
      margin-bottom: 20px;
    }

    .pplx-content {
      font-size: 28px;
      line-height: 1.5;
      color: #C5C9D3;
    }

    /* Math Formula Block */
    .pplx-formula-container {
      background: #111418;
      border: 1px solid #23272F;
      border-radius: 12px;
      padding: 24px;
      margin: 20px 0;
      text-align: center;
      font-size: 38px;
    }
    .pplx-formula-highlight {
      color: #20B8CD;
      border-bottom: 2px solid #20B8CD;
      padding-bottom: 2px;
    }

    /* Code Diff Container */
    .pplx-code-container {
      background: #0D0E11;
      border: 1px solid #23272F;
      border-radius: 12px;
      padding: 24px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 22px;
      line-height: 1.6;
      overflow-x: auto;
    }
    .code-line { display: flex; }
    .line-no { width: 45px; color: #646C7A; user-select: none; }
    .line-add { background: rgba(16, 185, 129, 0.15); color: #10B981; }
    .line-del { background: rgba(239, 68, 68, 0.15); color: #EF4444; }

    /* Citation Badge */
    .pplx-citation {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #1B1F26;
      border: 1px solid #23272F;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: #20B8CD;
      margin-left: 6px;
    }

    /* Dynamic Subtitle Demo Bar (Safe baseline: Y = 1540px) */
    .pplx-subtitle-bar {
      position: absolute;
      top: 1540px;
      left: 50%;
      transform: translateX(-50%);
      width: 820px;
      text-align: center;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.3;
      color: #8E95A2;
    }
    .pplx-subtitle-bar .active {
      color: #F3F3EE;
      background: rgba(32, 184, 205, 0.22);
      border-radius: 8px;
      padding: 2px 10px;
    }
  </style>
</head>
<body>
  <div class="safe-zone"></div>

  <div class="pplx-card">
    <div class="pplx-header-pill">
      <span>Deep Learning // Optimization</span>
    </div>
    <div class="pplx-title">FlashAttention-2 Memory Tiling</div>
    <div class="pplx-content">
      <div class='pplx-formula-container'>$$Attention(Q,K,V) = \text{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right)V$$</div>
    </div>
  </div>

  <div class="pplx-subtitle-bar">
    <span>EACH TOKEN REQUIRES</span> <span class="active">READING SRAM</span> <span>BANDWIDTH</span>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }
    });
  </script>
</body>
</html>
